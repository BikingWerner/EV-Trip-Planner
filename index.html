```html
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EV Trip Planner</title>

    <!-- Leaflet kaartbibliotheek -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #1f6feb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1557b0;
        }

        #map {
            height: 500px;
            border-radius: 10px;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
            gap: 10px;
        }

    </style>
</head>


<body>

<header>
    <h1>EV Trip Planner</h1>
    <p>Plan your electric vehicle journey with charging stops</p>
</header>


<div class="container">


    <div class="card">

        <h2>New Trip</h2>

        <label for="from">
            From
        </label>
        <input 
            id="from"
            type="text"
            placeholder="Enter departure location"
        >


        <label for="to">
            Destination
        </label>
        <input 
            id="to"
            type="text"
            placeholder="Enter destination"
        >


        <label>
            Target distance between charging stops (km)
        </label>

        <input 
            type="number"
            value="200"
        >


        <label>
            Maximum detour (km)
        </label>

        <input 
            type="number"
            value="5"
        >


        <label>
            Minimum charging power (kW)
        </label>

        <input 
            type="number"
            value="150"
        >


        <h3>Preferred charging networks</h3>

        <div class="options">

            <label>
                <input type="checkbox" checked>
                Ionity
            </label>

            <label>
                <input type="checkbox" checked>
                Fastned
            </label>

            <label>
                <input type="checkbox">
                Tesla Supercharger
            </label>

            <label>
                <input type="checkbox" checked>
                Allego
            </label>

            <label>
                <input type="checkbox">
                EnBW
            </label>

        </div>


        <button onclick="calculateRoute()">
            Calculate route
        </button>


    </div>



    <div class="card">

        <h2>Route map</h2>

        <div id="map"></div>

    </div>


    <div class="card">

        <h2>Charging stops</h2>

        <p id="results">
            No route calculated yet.
        </p>

    </div>


</div>


<!-- Leaflet javascript -->
<script 
    src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>


<script>

    // Initialiseer kaart
    const map = L.map('map')
        .setView([50.8503, 4.3517], 8);


    L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution:
            '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);



    function calculateRoute() {

        document.getElementById("results").innerHTML =
        `
        <b>Route calculation started...</b>
        <br><br>
        Next step:
        connect route calculation and charging stations.
        `;

    }


</script>


</body>
</html>
```

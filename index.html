```html
<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EV Trip Planner</title>


    <!-- Leaflet kaart -->
    <link 
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    >


    <!-- Eigen stijl -->
    <link 
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header>

    <h1>EV Trip Planner</h1>

    <p>
        Plan your electric vehicle journey
    </p>

</header>



<main class="container">



<section class="card">


    <h2>New Trip</h2>


    <label for="from">
        From
    </label>

    <input
        id="from"
        type="text"
        placeholder="Departure location"
    >



    <label for="to">
        Destination
    </label>

    <input
        id="to"
        type="text"
        placeholder="Destination"
    >



    <label for="distance">
        Target distance between charging stops (km)
    </label>

    <input
        id="distance"
        type="number"
        value="200"
    >



    <label for="detour">
        Maximum detour (km)
    </label>

    <input
        id="detour"
        type="number"
        value="5"
    >



    <label for="power">
        Minimum charging power (kW)
    </label>

    <input
        id="power"
        type="number"
        value="150"
    >



    <h3>
        Preferred charging networks
    </h3>



    <div class="options">


        <label>
            <input 
                type="checkbox"
                checked
            >
            Ionity
        </label>



        <label>
            <input 
                type="checkbox"
                checked
            >
            Fastned
        </label>



        <label>
            <input 
                type="checkbox"
            >
            Tesla
        </label>



        <label>
            <input 
                type="checkbox"
                checked
            >
            Allego
        </label>



        <label>
            <input 
                type="checkbox"
            >
            EnBW
        </label>


    </div>



    <button id="calculateButton">

        Calculate route

    </button>



</section>





<section class="card">


    <h2>
        Route map
    </h2>


    <div id="map"></div>


</section>





<section class="card">


    <h2>
        Route information
    </h2>


    <div id="results">

        Enter a route and calculate.

    </div>


</section>



</main>





<!-- Leaflet -->

<script
    src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>




<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Eigen scripts -->
<script src="js/config.js?v=3"></script>
<script src="js/map.js?v=4"></script>
<script src="js/route.js?v=3"></script>
<script src="js/app.js?v=10"></script>

</body>

</html>
```
